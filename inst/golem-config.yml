# Configuración de Biosonora.
# Se elige el bloque con la variable de entorno GOLEM_CONFIG_ACTIVE
# ("default" = local, "production" = servidor). Los bloques heredan de "default".
# No escribas aquí contraseñas ni claves: usa variables de entorno (.Renviron).
default:
  golem_name: biosonora
  golem_version: 0.0.0.9000
  app_prod: no
  # Modo de ejecución: "local" (lee una carpeta) o "server" (subida de archivos)
  run_mode: local
  # Zona horaria local para mostrar las fechas (las grabaciones AudioMoth suelen estar en UTC)
  local_timezone: Europe/Madrid
  # Rutas de datos de trabajo. Vacío = carpeta de datos de usuario del sistema
  # (fuera de OneDrive, para evitar bloqueos de SQLite)
  data_dir: ""
  # Tamaño máximo de cada archivo subido (MB), también al descomprimir un ZIP
  max_upload_mb: 2000
  # Solo modo servidor: carpetas del servidor que se pueden analizar
  # (el usuario elige de esta lista; nunca escribe rutas). Ejemplo:
  #   server_folders:
  #     - name: "Grabaciones compartidas"
  #       path: "/srv/biosonora/grabaciones"
  server_folders: []
  # Valores fijos para la exportación a Observation.org
  observation_org:
    method: "Oído"
    counting_method: "Visto/Sin contar"
    activity: "Presente"
    classifier: "BirdNet APP"
    notes_template: "ID mediante {classifier}"

production:
  app_prod: yes
  run_mode: server

dev:
  golem_wd: !expr golem::pkg_path()
