help:
  button: "Ayuda"
  folder: "La carpeta de la tarjeta SD o donde copiaste las grabaciones. Se buscan los archivos WAV también en las subcarpetas, y el CONFIG.TXT de AudioMoth se asocia solo."
  min_confidence: "BirdNET da a cada detección una puntuación de 0 a 100 %. No es una probabilidad de acierto: con umbrales bajos verás más detecciones, pero también más errores."
  speed: "A velocidad lenta el audio dura más y suena más grave. A 0,1x, un ultrasonido de murciélago de 40 kHz se oye a 4 kHz."
  freq_range: "Muestra solo esta banda de frecuencias. Las aves suelen estar por debajo de 12 kHz; los murciélagos, por encima de 15 kHz."
  contrast: "Rango de intensidades que se colorean. Con menos dB los sonidos débiles desaparecen y destacan los fuertes; con más dB se ven sonidos débiles, pero también más ruido."
  spectro_palette: "Viridis, Magma y Cividis se leen bien con cualquier tipo de daltonismo. Cividis se ve casi igual con y sin daltonismo. Grises: sonido fuerte = oscuro."
  chart_palette: "Las tres paletas son aptas para daltonismo. Okabe-Ito usa colores muy distintos entre sí; Viridis y Cividis van de oscuro a claro y se entienden también impresas en gris."
  use_location: "BirdNET solo propondrá especies que pueden vivir en esa zona. Sin coordenadas pueden aparecer especies de otros continentes."
  use_week: "BirdNET solo propondrá especies presentes en esa época del año (por ejemplo, sin migrantes en invierno)."
  overlap: "Con solapamiento, las ventanas de 3 segundos se superponen: se detectan mejor sonidos cortos que caen entre dos ventanas, pero tarda más."
  sensitivity: "Valores altos detectan más (también más errores); valores bajos, menos pero más seguros. Lo normal es 1."
  unverified: "Las detecciones que nadie ha revisado se exportan marcadas como no seguras («is certain = False»). Úsalo solo si no hay tiempo de revisar y con un umbral alto."
  taxonomy: "Observation.org usa la Lista IOC de Aves del Mundo. Si un nombre de BirdNET no existe en ella, elige aquí su equivalente."
  sites_plot: "Número de especies distintas detectadas en cada punto de muestreo con los filtros elegidos."
  accumulation_plot: "Cómo aumenta el número de especies al añadir grabaciones. Si la curva se aplana, el muestreo ya recoge casi todas las especies del lugar. La línea discontinua es la media de 100 órdenes al azar y la banda su intervalo del 95 %."
  hours_plot: "Detecciones por hora del día (hora local). Se muestran por separado las especies más frecuentes."
  upload: "Útil si te han enviado grabaciones por correo o trabajas en el servidor. Un ZIP puede contener carpetas con el CONFIG.TXT de AudioMoth. Las grabaciones subidas se guardan en la carpeta de datos de Biosonora."

welcome:
  title: "Bienvenida a Biosonora"
  intro: "Biosonora te ayuda a revisar grabaciones de sonidos de la naturaleza, confirmar las especies que propone BirdNET y enviarlas a Observation.org. Estos son los pasos:"
  step1_title: "1. Carga tus grabaciones"
  step1_text: "Escribe o elige la carpeta donde están los archivos de audio y pulsa «Analizar carpeta». La app reconoce sola las grabadoras AudioMoth y TASCAM y lee la fecha y la hora de cada pista."
  step2_title: "2. Ordena y filtra"
  step2_text: "En la barra de la izquierda puedes filtrar por fecha, hora, punto de muestreo, grabadora, especie o estado de revisión. Asigna a cada grabación su punto de muestreo con coordenadas."
  step3_title: "3. Mira y escucha"
  step3_text: "Haz clic en una grabación para ver su espectrograma. Pulsa la barra espaciadora para escucharla, haz clic para saltar a un momento y usa las velocidades lentas para oír los detalles. El botón «Atajos de teclado» resume todas las teclas."
  step4_title: "4. Revisa las detecciones"
  step4_text: "Analiza con BirdNET o importa sus resultados. Para cada detección indica si es correcta (V), incorrecta (X) o dudosa (D), o dibuja tus propias anotaciones. Todo se guarda solo."
  step5_title: "5. Comparte los resultados"
  step5_text: "En «Especies» verás el listado de especies; en «Resumen», los gráficos; y en «Exportar», el archivo para Observation.org y las tablas completas."
  progress: "Paso {step} de {total}"
